<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Modern Calculator</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #141e30, #243b55);
        }

        .calculator {
            width: 350px;
            padding: 22px;
            border-radius: 25px;
            background: #171717;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }

        .title {
            color: white;
            text-align: center;
            margin-bottom: 18px;
            font-size: 20px;
            letter-spacing: 2px;
        }

        .screen {
            width: 100%;
            height: 90px;
            border: none;
            outline: none;
            border-radius: 15px;
            background: #252525;
            color: white;
            font-size: 38px;
            text-align: right;
            padding: 15px;
            margin-bottom: 20px;
        }

        .buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .btn {
            flex: 1 1 22%;
            height: 60px;
            border: none;
            border-radius: 15px;
            font-size: 21px;
            cursor: pointer;
            background: #333333;
            color: white;
            transition: 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
            background: #444444;
        }

        .operator {
            background: #ff9500;
        }

        .operator:hover {
            background: #ffad33;
        }

        .clear {
            background: #e74c3c;
        }

        .clear:hover {
            background: #ff6252;
        }

        .equal {
            flex: 1 1 48%;
            background: #27ae60;
        }

        .equal:hover {
            background: #32c875;
        }

        .zero {
            flex: 1 1 48%;
        }
    </style>
</head>

<body>

    <div class="calculator">

        <div class="title">MODERN CALCULATOR</div>

        <input type="text" class="screen" id="screen" value="0" readonly>

        <div class="buttons">

            <button class="btn clear" onclick="clearScreen()">AC</button>
            <button class="btn" onclick="deleteNumber()">DEL</button>
            <button class="btn operator" onclick="addToScreen('%')">%</button>
            <button class="btn operator" onclick="addToScreen('/')">÷</button>

            <button class="btn" onclick="addToScreen('7')">7</button>
            <button class="btn" onclick="addToScreen('8')">8</button>
            <button class="btn" onclick="addToScreen('9')">9</button>
            <button class="btn operator" onclick="addToScreen('*')">×</button>

            <button class="btn" onclick="addToScreen('4')">4</button>
            <button class="btn" onclick="addToScreen('5')">5</button>
            <button class="btn" onclick="addToScreen('6')">6</button>
            <button class="btn operator" onclick="addToScreen('-')">−</button>

            <button class="btn" onclick="addToScreen('1')">1</button>
            <button class="btn" onclick="addToScreen('2')">2</button>
            <button class="btn" onclick="addToScreen('3')">3</button>
            <button class="btn operator" onclick="addToScreen('+')">+</button>

            <button class="btn zero" onclick="addToScreen('0')">0</button>
            <button class="btn" onclick="addToScreen('.')">.</button>
            <button class="btn equal" onclick="calculate()">=</button>

        </div>

    </div>

    <script>
        const screen = document.getElementById("screen");

        function addToScreen(value) {

            if (screen.value === "0" || screen.value === "Error") {
                screen.value = value;
            } else {
                screen.value += value;
            }
        }

        function clearScreen() {
            screen.value = "0";
        }

        function deleteNumber() {

            if (screen.value.length > 1) {
                screen.value = screen.value.slice(0, -1);
            } else {
                screen.value = "0";
            }
        }

        function calculate() {

            try {
                screen.value = eval(screen.value);
            } catch {
                screen.value = "Error";
            }
        }
    </script>

</body>

</html>
